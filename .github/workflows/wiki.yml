# Sync documentation chapters, Home, _Sidebar & _Footer to GitHub Repository Wiki
name: Sync Docs to GitHub Wiki

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "github-wiki"
  cancel-in-progress: false

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Wiki Markdown pages
        run: python3 docs/build_docs_bundle.py --export-wiki /tmp/wiki-export

      - name: Upload generated Wiki pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexa-github-wiki-pages
          path: /tmp/wiki-export/*.md

      - name: Publish to GitHub Wiki repository (if initialized)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git ls-remote "${WIKI_URL}" >/dev/null 2>&1; then
            echo "::notice title=Initialize GitHub Wiki once::Visit https://github.com/${GITHUB_REPOSITORY}/wiki, click 'Create the first page' -> 'Save Page' once to provision .wiki.git, then re-run 'Sync Docs to GitHub Wiki' to populate all 11 Wiki pages automatically."
            {
              echo "### GitHub Wiki One-Time Initialization Needed"
              echo "GitHub provisions \`${GITHUB_REPOSITORY}.wiki.git\` only after the first page is saved in the web UI:"
              echo "1. Open <https://github.com/${GITHUB_REPOSITORY}/wiki> and click **Create the first page** → **Save Page**."
              echo "2. Re-run **Sync Docs to GitHub Wiki** (or push to \`main\`) to publish \`Home.md\`, \`_Sidebar.md\`, \`_Footer.md\`, and all 8 documentation chapters."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git clone --depth 1 "${WIKI_URL}" /tmp/wiki-repo
          cp /tmp/wiki-export/*.md /tmp/wiki-repo/
          cd /tmp/wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "GitHub Wiki is already up to date."
          else
            git commit -m "docs(wiki): sync Wiki pages from ${GITHUB_SHA::7}"
            git push origin HEAD
          fi
