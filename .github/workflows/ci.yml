name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }} · Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
        exclude:
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install nexa-ui and dev dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=77.0" wheel
          python -m pip install --no-build-isolation -e ".[dev]"

      - name: Run pytest suite
        env:
          NEXA_HEADLESS: "1"
          PYTHONUTF8: "1"
        run: pytest -v -W error -o junit_family=xunit2 --junitxml=pytest-results.xml

      - name: Surface pytest failures as annotations
        if: failure()
        shell: python
        run: |
          import pathlib, xml.etree.ElementTree as ET
          p = pathlib.Path("pytest-results.xml")
          if p.is_file():
              for tc in ET.parse(p).iter("testcase"):
                  for node in [*tc.findall("failure"), *tc.findall("error")]:
                      title = f"{tc.attrib.get('classname', '')}.{tc.attrib.get('name', '')}"
                      msg = (node.text or node.attrib.get("message", "")).strip()[-1200:]
                      msg_esc = msg.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error title={title}::{msg_esc}")
