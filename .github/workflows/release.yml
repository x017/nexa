name: Release nexa-ui

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Publish built sdist & wheels to PyPI (requires Trusted Publisher)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-sdist:
    name: Build source distribution (sdist)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist & validate metadata
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --sdist --outdir dist
          twine check --strict dist/*

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & smoke-test wheels with cibuildwheel
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_OUTPUT_DIR: wheelhouse

      - name: Validate wheel metadata
        shell: bash
        run: |
          python3 -m pip install --upgrade twine || python -m pip install --upgrade twine
          python3 -m twine check --strict wheelhouse/*.whl || python -m twine check --strict wheelhouse/*.whl

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  github-release:
    name: Create GitHub Release
    needs: [build-sdist, build-wheels]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all built distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish-pypi:
    name: Publish to PyPI
    needs: [build-sdist, build-wheels]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_to_pypi == true)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nexa-ui
    permissions:
      id-token: write
    steps:
      - name: Download all built distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish distributions to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
