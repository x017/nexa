[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexa-ui"
version = "1.4.0"
description = "Fast, tiny, zero-dependency immediate-mode desktop UI for Python — a Python port of CUI"
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = [
    "LICENSE",
    "THIRD_PARTY.md",
    "csrc/third_party/licenses/LICENSE-*.txt",
]
requires-python = ">=3.9"
authors = [
    { name = "Parsa Mohammadian" }
]
keywords = [
    "ui",
    "gui",
    "cui",
    "native",
    "immediate-mode",
    "imgui",
    "desktop",
    "widgets",
    "charts",
    "opengl",
    "docking",
    "markdown",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX :: BSD",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "http://parsa.x017.ir/nexa/"
Documentation = "http://parsa.x017.ir/nexa/guide.html"
Repository = "https://github.com/x017/nexa"
Issues = "https://github.com/x017/nexa/issues"
Changelog = "http://parsa.x017.ir/nexa/guide.html#changelog"
"Upstream CUI" = "https://github.com/yappologistic/CUI"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
nexa-build = "nexa.build:main"

[project.entry-points.pyinstaller40]
hook-dirs = "nexa._pyinstaller:get_hook_dirs"

[tool.pytest.ini_options]
# plain `pytest` works from a fresh clone; the Python side builds the native
# library on first import, so there is nothing to compile before `make test`
testpaths = ["tests"]
addopts = "-ra"
norecursedirs = ["build", "dist", "docs", "wiki", "examples", "csrc", ".venv"]

[tool.cibuildwheel]
# nexa binds via ctypes (`py3-none-<plat>`) without linking libpython, so one build per OS/arch
# produces an ABI-independent wheel compatible with Python 3.9+.
build = "cp312-*"
skip = "*-win32 *-manylinux_i686 *-musllinux_i686"
environment = { NEXA_LTO = "1" }
test-command = "python -c \"import nexa as ui; assert ui.__version__; sw = ui.SoftwareRenderer(); ctx = ui.UI(width=320, height=200, renderer=sw); ctx.begin_frame(0.016); ctx.heading('nexa-ui'); dd = ctx.end_frame(); px = sw.render(dd); assert len(px) == 320 * 200 * 4; ctx.close(); sw.close()\""

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
environment = { NEXA_LTO = "1", MACOSX_DEPLOYMENT_TARGET = "11.0" }
