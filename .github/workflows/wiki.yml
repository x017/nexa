# Sync documentation chapters, Home, _Sidebar & _Footer to GitHub Repository Wiki
name: Sync Docs to GitHub Wiki

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "wiki/**"
      - ".github/workflows/wiki.yml"
  gollum:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "github-wiki"
  cancel-in-progress: false

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and generate GitHub Wiki Markdown pages
        run: python3 docs/build_docs_bundle.py --export-wiki /tmp/wiki-export

      - name: Upload generated Wiki pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexa-github-wiki-pages
          path: /tmp/wiki-export/*.md

      - name: Publish to GitHub Wiki repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          if ! git ls-remote "${WIKI_URL}" >/dev/null 2>&1; then
            echo "::notice title=Initialize GitHub Wiki once::Open https://github.com/${GITHUB_REPOSITORY}/wiki/_new and click 'Save Page' once; the 'gollum' webhook will immediately populate all 11 Wiki pages automatically."
            {
              echo "### GitHub Wiki One-Time Initialization Needed"
              echo "GitHub does not create \`${GITHUB_REPOSITORY}.wiki.git\` via API/tokens until the first page is saved once in the web UI:"
              echo "1. Open <https://github.com/${GITHUB_REPOSITORY}/wiki/_new> and click **Save Page** (no typing needed)."
              echo "2. This workflow listens to the \`gollum\` Wiki event and will automatically populate \`Home\`, \`_Sidebar\`, \`_Footer\`, and all 8 chapters within seconds!"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git clone --depth 1 "${WIKI_URL}" /tmp/wiki-repo
          if [ "${EVENT_NAME}" = "gollum" ] && [ -f /tmp/wiki-repo/_Sidebar.md ]; then
            echo "Wiki already initialized and synced; skipping overwrite on manual Wiki edit."
            exit 0
          fi

          cp /tmp/wiki-export/*.md /tmp/wiki-repo/
          cd /tmp/wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "GitHub Wiki is already up to date."
          else
            git commit -m "docs(wiki): sync Wiki pages from ${GITHUB_SHA::7}"
            git push origin HEAD
          fi
